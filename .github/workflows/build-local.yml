name: Build local VoiceInk

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-local.yml"

permissions:
  contents: read

concurrency:
  group: build-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ad-hoc signed app
    runs-on: xcode-27
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Show build environment
        run: |
          uname -m
          xcodebuild -version
          xcrun swift --version

      - name: Install Metal toolchain
        run: xcodebuild -downloadComponent MetalToolchain

      - name: Cache whisper.cpp framework
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/VoiceInk-Dependencies/whisper.cpp
          key: whisper-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            whisper-${{ runner.os }}-${{ runner.arch }}-

      - name: Build VoiceInk
        run: >-
          make local
          LOCAL_CODESIGN_IDENTITY=-
          LOCAL_XCODEBUILD_FLAGS="-skipMacroValidation -skipPackagePluginValidation -onlyUsePackageVersionsFromResolvedFile"

      - name: Verify and package app
        run: |
          set -euo pipefail
          app="$HOME/Downloads/VoiceInk.app"
          test -d "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          executable="$app/Contents/MacOS/VoiceInk"
          file "$executable"
          lipo -info "$executable"
          archive="VoiceInk-${GITHUB_SHA::7}-arm64.zip"
          ditto -c -k --sequesterRsrc --keepParent "$app" "$archive"
          shasum -a 256 "$archive" > "$archive.sha256"

      - name: Upload VoiceInk app
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: VoiceInk-${{ github.sha }}-arm64
          path: |
            VoiceInk-*-arm64.zip
            VoiceInk-*-arm64.zip.sha256
          if-no-files-found: error
          retention-days: 14
